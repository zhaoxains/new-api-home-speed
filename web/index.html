<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <style>
      body {
        margin: 0;
      }
      #app-loading {
        align-items: center;
        background: #f8fafc;
        color: #334155;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
      }
      .app-loading__content {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(20rem, calc(100vw - 3rem));
      }
      .app-loading__status {
        align-items: center;
        display: flex;
        gap: 0.625rem;
        font-size: 0.875rem;
      }
      .dark #app-loading {
        background: #111827;
        color: #e2e8f0;
      }
      #app-loading-indicator {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid currentColor;
        border-radius: 50%;
        border-right-color: transparent;
        height: 1rem;
        width: 1rem;
      }
      .app-loading__track {
        background: #dbe3ed;
        border-radius: 999px;
        height: 0.25rem;
        overflow: hidden;
      }
      .dark .app-loading__track {
        background: #334155;
      }
      #app-loading-fill {
        background: #2878d0;
        border-radius: inherit;
        display: block;
        height: 100%;
        transition: width 220ms ease;
        width: 0%;
      }
      .dark #app-loading-fill {
        background: #70b7f2;
      }
      .app-loading__meta {
        color: #64748b;
        display: flex;
        font-size: 0.75rem;
        justify-content: space-between;
      }
      .dark .app-loading__meta {
        color: #94a3b8;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading-indicator {
          animation: none;
        }
        #app-loading-fill {
          transition: none;
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate">
      <div id="app-loading" data-app-loading role="status" aria-live="polite">
        <div class="app-loading__content">
          <div class="app-loading__status">
            <span id="app-loading-indicator" aria-hidden="true"></span>
            <span>正在加载页面 / Loading page</span>
          </div>
          <div
            class="app-loading__track"
            role="progressbar"
            aria-label="预计加载进度 / Estimated loading progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            data-app-loading-progress
          >
            <span id="app-loading-fill" data-app-loading-fill></span>
          </div>
          <div class="app-loading__meta">
            <span>预计进度 / Estimated</span>
            <span data-app-loading-percent>~0%</span>
          </div>
        </div>
      </div>
    </div>
    <script id="app-loading-progress-script">
      ;(function () {
        var bar = document.querySelector('[data-app-loading-progress]')
        var fill = document.querySelector('[data-app-loading-fill]')
        var label = document.querySelector('[data-app-loading-percent]')
        if (!bar || !fill || !label) return

        var progress = 0
        var update = function (value) {
          var displayedProgress = Math.round(value)
          bar.setAttribute('aria-valuenow', String(displayedProgress))
          bar.setAttribute(
            'aria-valuetext',
            '预计 ' +
              displayedProgress +
              '% / Estimated ' +
              displayedProgress +
              '%'
          )
          fill.style.width = displayedProgress + '%'
          label.textContent = '~' + displayedProgress + '%'
        }
        var timer = window.setInterval(function () {
          if (progress >= 90) return
          progress += Math.max(0.25, (90 - progress) * 0.035)
          update(Math.min(progress, 90))
        }, 250)

        window.addEventListener(
          'newapi:app-ready',
          function () {
            window.clearInterval(timer)
            update(100)
          },
          { once: true }
        )
      })()
    </script>
  </body>
</html>
