<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <style>
      body {
        margin: 0;
      }
      #app-loading {
        align-items: center;
        background: #f8fafc;
        color: #334155;
        display: flex;
        font-family: system-ui, sans-serif;
        gap: 0.75rem;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
      }
      .dark #app-loading {
        background: #111827;
        color: #e2e8f0;
      }
      #app-loading-indicator {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid currentColor;
        border-radius: 50%;
        border-right-color: transparent;
        height: 1rem;
        width: 1rem;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading-indicator {
          animation: none;
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate">
      <div id="app-loading" data-app-loading role="status" aria-live="polite">
        <span id="app-loading-indicator" aria-hidden="true"></span>
        <span>正在加载页面 / Loading page</span>
      </div>
    </div>
  </body>
</html>
