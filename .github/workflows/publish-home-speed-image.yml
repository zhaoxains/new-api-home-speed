name: Publish home speed image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check frontend types
        working-directory: web
        run: bun check -b

      - name: Test retained customizations
        working-directory: web
        run: >-
          bun run test src/i18n/languages.test.ts
          src/components/__tests__/date-picker-locale.test.tsx
          src/context/__tests__/theme-boot-script.test.ts
          src/hooks/__tests__/top-nav-links.test.tsx

      - name: Lint retained customizations
        working-directory: web
        run: >-
          bunx oxlint -c .oxlintrc.json src/main.tsx
          src/hooks/use-top-nav-links.ts src/hooks/__tests__/top-nav-links.test.tsx
          src/i18n/config.ts src/i18n/languages.ts src/i18n/languages.test.ts
          src/components/date-picker.tsx src/components/datetime-picker.tsx
          src/components/__tests__/date-picker-locale.test.tsx
          src/context/__tests__/theme-boot-script.test.ts

      - name: Check customization formatting
        working-directory: web
        run: >-
          bunx oxfmt --check index.html src/main.tsx
          src/hooks/use-top-nav-links.ts src/hooks/__tests__/top-nav-links.test.tsx
          src/i18n/config.ts src/i18n/languages.ts src/i18n/languages.test.ts
          src/components/date-picker.tsx src/components/datetime-picker.tsx
          src/components/__tests__/date-picker-locale.test.tsx
          src/context/__tests__/theme-boot-script.test.ts src/i18n/locales/*.json

      - name: Read release version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-api-home-speed:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/new-api-home-speed:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/new-api-home-speed:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
